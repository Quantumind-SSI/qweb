name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: swa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    environment: production

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: false
          lfs: false

      - name: Generate runtime config
        run: |
          cat > js/config.js <<'EOC'
          window.QSSI_CONFIG = {
            apiBase: '/api',
            athenoir: {
              enabled: ATHENOIR_ENABLED
            },
            supportEmail: 'SUPPORT_EMAIL'
          };
          EOC
          sed -i "s|ATHENOIR_ENABLED|${{ vars.ATHENOIR_ENABLED || 'false' }}|"          js/config.js
          sed -i "s|SUPPORT_EMAIL|${{ vars.SUPPORT_EMAIL || 'hello@quantumindssi.com' }}|" js/config.js

      - name: Guard against committed secrets
        run: |
          if grep -rEn "eyJhbGciOi[A-Za-z0-9_-]{10,}" --include='*.js' --include='*.html' --include='*.json' .; then
            echo "::error::A JWT was found in tracked source. Deployment blocked."
            exit 1
          fi

      - name: Deploy
        id: deploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: '/'
          api_location: 'api'
          output_location: ''
          skip_app_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close preview environment
    steps:
      - name: Close
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
